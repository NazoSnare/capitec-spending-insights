# Every push and pull request: lint, unit tests, build, end-to-end tests, and the
# Docker image built and health-checked.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spending-insights .
      - name: Run the image and wait for it to report healthy
        run: |
          docker run -d --name app -p 3000:3000 spending-insights
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' app | grep -q healthy
          curl -fsS http://localhost:3000/api/customers/12345/spending/summary
